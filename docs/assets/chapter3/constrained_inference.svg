<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1680" height="600" viewBox="0 0 1680 600" role="img" aria-labelledby="title desc">
  <title id="title">合法 code 空间内的自回归 Skill 路由</title>
  <desc id="desc">同版本 registry 产生 active code 路径和前缀树；Router LLM 接收用户 query 并产生全词表 logits，前缀树在每个自回归位置屏蔽非法 token。Greedy 生成一个完整多路径序列，Beam 对独立单路径进行近似 Top-B 排名，最后展开碰撞桶并执行 candidate top-k。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .phase { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .label { font-size: 15px; font-weight: 650; }
      .small { font-size: 13px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 11.5px; font-weight: 500; fill: #64748b; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11.5px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1680" height="600" fill="#ffffff"/>
  <rect x="20" y="20" width="330" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="370" y="20" width="400" height="560" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="790" y="20" width="570" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="1380" y="20" width="280" height="560" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.4"/>

  <path d="M350 300 H362" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M770 300 H782" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1360 300 H1372" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- (a) Active registry -->
  <rect x="42" y="42" width="68" height="22" rx="11" fill="#dcfce7"/>
  <text x="76" y="57" text-anchor="middle" class="phase" fill="#047857">REGISTRY</text>
  <text x="42" y="91" class="panel-title">(a) Active code 空间</text>

  <rect x="45" y="125" width="125" height="326" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="107.5" y="153" text-anchor="middle" class="label">Skill registry</text>
  <rect x="58" y="174" width="99" height="47" rx="6" fill="#f0fdf4"/>
  <circle cx="74" cy="197.5" r="8" fill="#10b981"/>
  <path d="M70 197 L73 201 L79 192" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="117" y="202" text-anchor="middle" class="small">天气查询</text>
  <rect x="58" y="231" width="99" height="47" rx="6" fill="#f0fdf4"/>
  <circle cx="74" cy="254.5" r="8" fill="#10b981"/>
  <path d="M70 254 L73 258 L79 249" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="117" y="259" text-anchor="middle" class="small">地图导航</text>
  <rect x="58" y="288" width="99" height="47" rx="6" fill="#f8fafc"/>
  <circle cx="74" cy="311.5" r="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="117" y="316" text-anchor="middle" class="small">邮件发送</text>
  <rect x="58" y="345" width="99" height="47" rx="6" fill="#f0fdf4"/>
  <circle cx="74" cy="368.5" r="8" fill="#10b981"/>
  <path d="M70 368 L73 372 L79 363" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="117" y="373" text-anchor="middle" class="small">行程规划</text>
  <text x="107.5" y="427" text-anchor="middle" class="tiny">唯一候选集的当前状态</text>

  <path d="M170 288 H194" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <rect x="202" y="147" width="123" height="282" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="263.5" y="175" text-anchor="middle" class="label">Active paths</text>
  <rect x="216" y="198" width="95" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="263.5" y="220" text-anchor="middle" class="mono">L1 : 12</text>
  <text x="263.5" y="243" text-anchor="middle" class="mono">L2 : 37</text>
  <rect x="216" y="269" width="95" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="263.5" y="291" text-anchor="middle" class="mono">L1 : 44</text>
  <text x="263.5" y="314" text-anchor="middle" class="mono">L2 : 08</text>
  <rect x="216" y="340" width="95" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="263.5" y="362" text-anchor="middle" class="mono">L1 : 12</text>
  <text x="263.5" y="385" text-anchor="middle" class="mono">L2 : 19</text>
  <text x="263.5" y="417" text-anchor="middle" class="tiny">deduplicated</text>

  <rect x="58" y="487" width="254" height="53" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="185" y="509" text-anchor="middle" class="label">C<tspan baseline-shift="sub" font-size="11">act</tspan></text>
  <text x="185" y="529" text-anchor="middle" class="small">合法 code 路径集合</text>

  <!-- (b) Router prediction and trie mask -->
  <rect x="392" y="42" width="58" height="22" rx="11" fill="#e0f2fe"/>
  <text x="421" y="57" text-anchor="middle" class="phase" fill="#0369a1">MASK</text>
  <text x="392" y="91" class="panel-title">(b) Router 预测与 Trie 约束</text>

  <rect x="395" y="122" width="350" height="282" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="570" y="150" text-anchor="middle" class="label">Active-path prefix trie</text>
  <circle cx="570" cy="182" r="9" fill="#475569"/>
  <path d="M570 191 V212 M570 205 H487 V227 M570 205 H653 V227" fill="none" stroke="#475569" stroke-width="1.8"/>
  <rect x="442" y="228" width="90" height="31" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="487" y="249" text-anchor="middle" class="mono">L1 : 12</text>
  <rect x="608" y="228" width="90" height="31" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="653" y="249" text-anchor="middle" class="mono">L1 : 44</text>
  <path d="M487 259 V281 M487 274 H452 V294 M487 274 H522 V294 M653 259 V294" fill="none" stroke="#0891b2" stroke-width="1.7"/>
  <rect x="414" y="295" width="76" height="29" rx="5" fill="#cffafe" stroke="#22d3ee"/>
  <text x="452" y="315" text-anchor="middle" class="mono">L2:37</text>
  <rect x="496" y="295" width="76" height="29" rx="5" fill="#cffafe" stroke="#22d3ee"/>
  <text x="534" y="315" text-anchor="middle" class="mono">L2:19</text>
  <rect x="615" y="295" width="76" height="29" rx="5" fill="#cffafe" stroke="#22d3ee"/>
  <text x="653" y="315" text-anchor="middle" class="mono">L2:08</text>
  <circle cx="452" cy="346" r="8" fill="#dcfce7" stroke="#059669"/>
  <circle cx="534" cy="346" r="8" fill="#dcfce7" stroke="#059669"/>
  <circle cx="653" cy="346" r="8" fill="#dcfce7" stroke="#059669"/>
  <path d="M452 324 V338 M534 324 V338 M653 324 V338" stroke="#059669" stroke-width="1.5"/>
  <text x="570" y="384" text-anchor="middle" class="tiny">当前前缀 → 合法 next-token 集合</text>

  <path d="M653 354 C717 361 733 391 697 423" fill="none" stroke="#0891b2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>

  <rect x="405" y="426" width="330" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <rect x="416" y="450" width="89" height="59" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="460.5" y="473" text-anchor="middle" class="label">用户 Query</text>
  <text x="460.5" y="495" text-anchor="middle" class="tiny">“规划五一出游”</text>
  <path d="M505 479.5 H523" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="531" y="438" width="111" height="84" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <rect x="548" y="453" width="17" height="19" rx="4" fill="#ede9fe" stroke="#a78bfa"/>
  <rect x="578" y="453" width="17" height="19" rx="4" fill="#ddd6fe" stroke="#8b5cf6"/>
  <rect x="608" y="453" width="17" height="19" rx="4" fill="#ede9fe" stroke="#a78bfa"/>
  <path d="M565 462.5 H578 M595 462.5 H608" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="586.5" y="493" text-anchor="middle" class="label">Router LLM</text>
  <text x="586.5" y="512" text-anchor="middle" class="mono">θ*</text>

  <path d="M642 479.5 H657" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="649.5" y="466" text-anchor="middle" class="tiny">logits</text>

  <rect x="665" y="438" width="58" height="84" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="694" y="454" text-anchor="middle" class="tiny">masked</text>
  <line x1="673" y1="501" x2="715" y2="501" stroke="#94a3b8" stroke-width="1"/>
  <rect x="674" y="475" width="7" height="26" fill="#2563eb"/>
  <rect x="685" y="483" width="7" height="18" fill="#0891b2"/>
  <rect x="696" y="470" width="7" height="31" fill="#94a3b8"/>
  <rect x="707" y="488" width="7" height="13" fill="#94a3b8"/>
  <path d="M694 472 L705 499 M705 472 L694 499 M705 480 L716 500 M716 480 L705 500" stroke="#ef4444" stroke-width="1.4"/>
  <text x="694" y="516" text-anchor="middle" class="tiny">−∞</text>

  <text x="570" y="570" text-anchor="middle" class="small">每个自回归位置：模型预测 + 合法路径约束</text>

  <!-- (c) Decoding modes -->
  <rect x="812" y="42" width="66" height="22" rx="11" fill="#ede9fe"/>
  <text x="845" y="57" text-anchor="middle" class="phase" fill="#6d28d9">DECODE</text>
  <text x="812" y="91" class="panel-title">(c) 两种约束解码语义</text>

  <rect x="815" y="121" width="520" height="202" rx="9" fill="#ffffff" stroke="#34d399" stroke-width="1.3"/>
  <rect x="833" y="139" width="75" height="25" rx="12.5" fill="#dcfce7"/>
  <text x="870.5" y="156" text-anchor="middle" class="phase" fill="#047857">GREEDY</text>
  <text x="928" y="156" class="small">一个完整的多路径序列</text>

  <rect x="837" y="190" width="82" height="33" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="878" y="211" text-anchor="middle" class="mono">L1:12</text>
  <rect x="927" y="190" width="82" height="33" rx="6" fill="#cffafe" stroke="#22d3ee"/>
  <text x="968" y="211" text-anchor="middle" class="mono">L2:37</text>
  <path d="M1009 206 H1031" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polygon points="1065,181 1100,206 1065,231 1030,206" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1065" y="203" text-anchor="middle" class="tiny">NL</text>
  <text x="1065" y="217" text-anchor="middle" class="tiny">/ EOS</text>
  <path d="M1100 206 H1122" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1130" y="190" width="82" height="33" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1171" y="211" text-anchor="middle" class="mono">L1:44</text>
  <rect x="1220" y="190" width="82" height="33" rx="6" fill="#cffafe" stroke="#22d3ee"/>
  <text x="1261" y="211" text-anchor="middle" class="mono">L2:08</text>
  <text x="1316" y="211" text-anchor="middle" class="small">EOS</text>

  <path d="M878 237 H1302" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="1075" y="268" text-anchor="middle" class="small">边界处由模型决定停止或继续；已完成路径不再生成</text>
  <rect x="928" y="282" width="294" height="25" rx="12.5" fill="#f0fdf4"/>
  <text x="1075" y="299" text-anchor="middle" class="tiny">输出路径数 m 由自回归边界决策产生</text>

  <rect x="815" y="342" width="520" height="200" rx="9" fill="#ffffff" stroke="#60a5fa" stroke-width="1.3"/>
  <rect x="833" y="360" width="65" height="25" rx="12.5" fill="#dbeafe"/>
  <text x="865.5" y="377" text-anchor="middle" class="phase" fill="#1d4ed8">BEAM</text>
  <text x="918" y="377" class="small">多条独立单路径的近似 Top-B</text>

  <circle cx="873" cy="426" r="8" fill="#475569"/>
  <path d="M881 426 H905 M905 426 V402 M905 426 V450" fill="none" stroke="#475569" stroke-width="1.7"/>
  <rect x="914" y="389" width="75" height="27" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="951.5" y="407" text-anchor="middle" class="mono">L1:12</text>
  <rect x="914" y="437" width="75" height="27" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="951.5" y="455" text-anchor="middle" class="mono">L1:44</text>
  <path d="M989 402 H1012 M989 450 H1012" fill="none" stroke="#475569" stroke-width="1.6"/>
  <rect x="1020" y="389" width="75" height="27" rx="5" fill="#cffafe" stroke="#22d3ee"/>
  <text x="1057.5" y="407" text-anchor="middle" class="mono">L2:37</text>
  <rect x="1020" y="437" width="75" height="27" rx="5" fill="#cffafe" stroke="#22d3ee"/>
  <text x="1057.5" y="455" text-anchor="middle" class="mono">L2:08</text>
  <path d="M1095 402 H1122 M1095 450 H1122" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
  <rect x="1130" y="384" width="177" height="87" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1150" y="410" class="label">#1</text>
  <text x="1223" y="410" text-anchor="middle" class="mono">12 · 37</text>
  <line x1="1145" y1="426" x2="1292" y2="426" stroke="#cbd5e1"/>
  <text x="1150" y="454" class="label">#2</text>
  <text x="1223" y="454" text-anchor="middle" class="mono">44 · 08</text>
  <rect x="925" y="491" width="300" height="28" rx="14" fill="#eff6ff"/>
  <text x="1075" y="510" text-anchor="middle" class="tiny">每个结果恰含 L 个 token；无 newline / EOS</text>

  <!-- (d) Bucket expansion -->
  <rect x="1402" y="42" width="63" height="22" rx="11" fill="#fef3c7"/>
  <text x="1433.5" y="57" text-anchor="middle" class="phase" fill="#92400e">EXPAND</text>
  <text x="1402" y="91" class="panel-title">(d) Bucket → top-k</text>

  <rect x="1405" y="123" width="230" height="139" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="1520" y="149" text-anchor="middle" class="label">Ranked code paths</text>
  <rect x="1421" y="170" width="198" height="33" rx="6" fill="#eff6ff"/>
  <text x="1441" y="191" class="label">#1</text>
  <text x="1535" y="191" text-anchor="middle" class="mono">12 · 37</text>
  <rect x="1421" y="213" width="198" height="33" rx="6" fill="#eff6ff"/>
  <text x="1441" y="234" class="label">#2</text>
  <text x="1535" y="234" text-anchor="middle" class="mono">44 · 08</text>
  <path d="M1520 262 V284" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <rect x="1405" y="293" width="230" height="111" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="1520" y="319" text-anchor="middle" class="label">Registry buckets</text>
  <rect x="1421" y="336" width="92" height="47" rx="6" fill="#ecfdf5"/>
  <text x="1467" y="355" text-anchor="middle" class="tiny">path #1</text>
  <text x="1467" y="375" text-anchor="middle" class="small">{s₁, s₂}</text>
  <rect x="1527" y="336" width="92" height="47" rx="6" fill="#ecfdf5"/>
  <text x="1573" y="355" text-anchor="middle" class="tiny">path #2</text>
  <text x="1573" y="375" text-anchor="middle" class="small">{s₃}</text>
  <path d="M1520 404 V426" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <rect x="1405" y="435" width="230" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1520" y="459" text-anchor="middle" class="label">flatten · deduplicate</text>
  <rect x="1421" y="474" width="198" height="23" rx="5" fill="#dcfce7"/>
  <text x="1520" y="490" text-anchor="middle" class="small">1 · s₁　 2 · s₂　 3 · s₃</text>
  <line x1="1421" y1="506" x2="1619" y2="506" stroke="#ef4444" stroke-width="1.7" stroke-dasharray="5 4"/>
  <text x="1520" y="529" text-anchor="middle" class="small" fill="#b91c1c">candidate top-k cut</text>
  <text x="1520" y="562" text-anchor="middle" class="tiny">B<tspan baseline-shift="sub" font-size="9">beam</tspan> ≠ candidate k</text>
</svg>
