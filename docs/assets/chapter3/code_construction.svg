  <rect x="514" y="153" width="128" height="96" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="578" y="176" text-anchor="middle" class="label">Level 1</text>
  <circle cx="543" cy="207" r="8" fill="#bfdbfe" stroke="#2563eb"/>
  <circle cx="568" cy="207" r="8" fill="#bfdbfe" stroke="#2563eb"/>
