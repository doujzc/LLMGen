  <path d="M1155 328 V354" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="980" y="365" width="350" height="155" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="1155" y="392" text-anchor="middle" class="label">Balanced prefix tree</text>
