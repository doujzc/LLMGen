<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1680" height="660" viewBox="0 0 1680 660" role="img" aria-labelledby="title desc">
  <title id="title">图正则化残差码本的训练流程</title>
  <desc id="desc">Skill 文档和多 Skill 目标分别产生冻结语义向量与协同图；边感知采样形成训练批次。编码器、逐层 Sinkhorn 平衡硬分配、残差更新和解码器构成训练前向。重构、向量量化和图平滑损失形成联合目标，反向更新编码器、解码器和各层码本。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .phase { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .label { font-size: 15px; font-weight: 650; }
      .small { font-size: 13px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 11.5px; font-weight: 500; fill: #64748b; }
      .math { font-family: "Times New Roman", "Noto Sans CJK SC", serif; font-size: 17px; font-style: italic; }
      .formula { font-family: "Times New Roman", "Noto Sans CJK SC", serif; font-size: 14px; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1680" height="660" fill="#ffffff"/>
  <rect x="20" y="20" width="360" height="620" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="400" y="20" width="750" height="620" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="1170" y="20" width="490" height="620" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>

  <path d="M380 330 H392" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1150 330 H1162" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- (a) Frozen signals and edge-aware batch -->
  <rect x="42" y="42" width="59" height="22" rx="11" fill="#e0f2fe"/>
  <text x="71.5" y="57" text-anchor="middle" class="phase" fill="#0369a1">INPUT</text>
  <text x="42" y="91" class="panel-title">(a) 训练信号与批采样</text>

  <rect x="45" y="120" width="145" height="155" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="59" y="134" width="58" height="20" rx="10" fill="#dbeafe"/>
  <text x="88" y="148" text-anchor="middle" class="phase" fill="#1d4ed8">FROZEN</text>
  <text x="117.5" y="178" text-anchor="middle" class="label">Skill documents</text>
  <rect x="62" y="193" width="28" height="35" rx="4" fill="#eff6ff" stroke="#60a5fa"/>
  <path d="M68 202 H84 M68 209 H84 M68 216 H80" stroke="#2563eb" stroke-width="1.4"/>
  <path d="M93 210 H105" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="111" y="192" width="61" height="36" rx="18" fill="#ede9fe"/>
  <text x="141.5" y="215" text-anchor="middle" class="formula">f<tspan baseline-shift="sub" font-size="10">emb</tspan></text>
  <path d="M141.5 228 V238" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <text x="117.5" y="256" text-anchor="middle" class="formula">xᵢ ∈ Rᵈ</text>

  <rect x="210" y="120" width="145" height="155" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="282.5" y="150" text-anchor="middle" class="label">Multi-skill targets</text>
  <text x="282.5" y="174" text-anchor="middle" class="formula">T(q) ⊆ S</text>
  <path d="M282.5 179 V188" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <line x1="239" y1="220" x2="273" y2="197" stroke="#059669" stroke-width="4"/>
  <line x1="273" y1="197" x2="325" y2="222" stroke="#059669" stroke-width="2"/>
  <line x1="239" y1="220" x2="292" y2="244" stroke="#059669" stroke-width="2.5"/>
  <line x1="292" y1="244" x2="325" y2="222" stroke="#059669" stroke-width="1.5"/>
  <circle cx="239" cy="220" r="8" fill="#dcfce7" stroke="#059669"/>
  <circle cx="273" cy="197" r="8" fill="#dcfce7" stroke="#059669"/>
  <circle cx="292" cy="244" r="8" fill="#dcfce7" stroke="#059669"/>
  <circle cx="325" cy="222" r="8" fill="#dcfce7" stroke="#059669"/>
  <text x="282.5" y="264" text-anchor="middle" class="formula">G = (S, E, W)</text>

  <path d="M117.5 275 V302 H200 M282.5 275 V302 H200 V315" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="55" y="322" width="290" height="90" rx="9" fill="#ffffff" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="200" y="349" text-anchor="middle" class="label">Edge-aware sampler</text>
  <text x="200" y="374" text-anchor="middle" class="small">base Skills → weighted neighbors</text>
  <text x="200" y="397" text-anchor="middle" class="small">→ random fill</text>
  <path d="M200 412 V438" fill="none" stroke="#f59e0b" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="55" y="448" width="290" height="142" rx="9" fill="#ffffff" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="74" y="475" class="phase" fill="#6d28d9">MINI-BATCH</text>
  <rect x="72" y="493" width="114" height="68" rx="8" fill="#eff6ff"/>
  <text x="129" y="516" text-anchor="middle" class="formula">X<tspan baseline-shift="sub" font-size="10">B</tspan> = {xᵢ}</text>
  <rect x="91" y="534" width="8" height="17" rx="2" fill="#bfdbfe"/>
  <rect x="105" y="526" width="8" height="25" rx="2" fill="#60a5fa"/>
  <rect x="119" y="531" width="8" height="20" rx="2" fill="#2563eb"/>
  <rect x="141" y="522" width="8" height="29" rx="2" fill="#93c5fd"/>
  <rect x="200" y="493" width="128" height="68" rx="8" fill="#f0fdf4"/>
  <text x="264" y="516" text-anchor="middle" class="formula">E<tspan baseline-shift="sub" font-size="10">B</tspan>, wᵢⱼ</text>
  <line x1="224" y1="543" x2="253" y2="529" stroke="#059669" stroke-width="3"/>
  <line x1="253" y1="529" x2="300" y2="544" stroke="#059669" stroke-width="2"/>
  <circle cx="224" cy="543" r="6" fill="#dcfce7" stroke="#059669"/>
  <circle cx="253" cy="529" r="6" fill="#dcfce7" stroke="#059669"/>
  <circle cx="300" cy="544" r="6" fill="#dcfce7" stroke="#059669"/>
  <text x="200" y="580" text-anchor="middle" class="tiny">语义向量 + batch 内加权边</text>

  <!-- (b) Sinkhorn residual-quantization forward -->
  <rect x="422" y="42" width="75" height="22" rx="11" fill="#ede9fe"/>
  <text x="459.5" y="57" text-anchor="middle" class="phase" fill="#6d28d9">FORWARD</text>
  <text x="422" y="91" class="panel-title">(b) Sinkhorn 残差量化前向</text>

  <circle cx="447" cy="153" r="24" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="447" y="159" text-anchor="middle" class="formula">X<tspan baseline-shift="sub" font-size="10">B</tspan></text>
  <path d="M471 153 H492" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="500" y="119" width="108" height="68" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="554" y="147" text-anchor="middle" class="label">Encoder</text>
  <text x="554" y="170" text-anchor="middle" class="formula">E<tspan baseline-shift="sub" font-size="10">φ</tspan></text>
  <path d="M608 153 H632" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="640" y="127" width="112" height="52" rx="26" fill="#ffffff" stroke="#a78bfa"/>
  <text x="696" y="159" text-anchor="middle" class="formula">zᵢ = rᵢ⁽⁰⁾</text>
  <rect x="865" y="127" width="245" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="987.5" y="148" text-anchor="middle" class="tiny">训练 batch 或完整候选集逐层求分配</text>
  <text x="987.5" y="168" text-anchor="middle" class="tiny">训练前向与训练后 raw code 共用 Sinkhorn</text>

  <rect x="425" y="211" width="700" height="270" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.3"/>
  <rect x="443" y="227" width="124" height="23" rx="11.5" fill="#dbeafe"/>
  <text x="505" y="243" text-anchor="middle" class="phase" fill="#1d4ed8">LEVEL ℓ = 1, …, L</text>

  <rect x="442" y="272" width="84" height="91" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="484" y="304" text-anchor="middle" class="formula">rᵢ⁽ℓ⁻¹⁾</text>
  <text x="484" y="329" text-anchor="middle" class="tiny">current</text>
  <text x="484" y="347" text-anchor="middle" class="tiny">residual</text>
  <path d="M526 317 H542" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="550" y="272" width="116" height="91" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="608" y="298" text-anchor="middle" class="label">Distances</text>
  <text x="608" y="325" text-anchor="middle" class="formula">Dᶩᵢₖ</text>
  <text x="608" y="348" text-anchor="middle" class="tiny">‖rᵢ⁽ℓ⁻¹⁾−eᶩₖ‖²</text>
  <path d="M666 317 H680" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="688" y="260" width="164" height="115" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.3"/>
  <rect x="703" y="275" width="77" height="20" rx="10" fill="#ddd6fe"/>
  <text x="741.5" y="289" text-anchor="middle" class="phase" fill="#6d28d9">TRAIN ONLY</text>
  <text x="770" y="319" text-anchor="middle" class="label">Sinkhorn</text>
  <text x="770" y="342" text-anchor="middle" class="formula">Qᶩ = SK(−Dᶩ / ε)</text>
  <text x="770" y="362" text-anchor="middle" class="tiny">rows = 1 · columns ≈ B/Kᶩ</text>
  <path d="M852 317 H866" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="874" y="272" width="112" height="91" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="930" y="298" text-anchor="middle" class="label">Hard index</text>
  <text x="930" y="325" text-anchor="middle" class="formula">aᶩᵢ = arg max Qᶩᵢₖ</text>
  <text x="930" y="348" text-anchor="middle" class="tiny">eᶩᵢ = Cᶩ[aᶩᵢ]</text>
  <path d="M986 317 H1000" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="1008" y="272" width="99" height="91" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1057.5" y="298" text-anchor="middle" class="label">Update</text>
  <text x="1057.5" y="325" text-anchor="middle" class="formula">rᶩᵢ</text>
  <text x="1057.5" y="348" text-anchor="middle" class="tiny">rᶩᵢ = rᶩ⁻¹ᵢ − ẽᶩᵢ</text>

  <path d="M1057.5 363 V393 H484 V371" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <text x="777" y="389" text-anchor="middle" class="tiny">carry residual to level ℓ + 1</text>

  <path d="M930 363 V402 H611.5 V408" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M930 402 H906.5 V408" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="486" y="416" width="251" height="43" rx="21.5" fill="#eff6ff"/>
  <text x="611.5" y="443" text-anchor="middle" class="formula">training indices  aᵢ = (aᵢ¹, …, aᵢᴸ)</text>
  <rect x="759" y="416" width="295" height="43" rx="21.5" fill="#ecfdf5"/>
  <text x="906.5" y="443" text-anchor="middle" class="formula">ẑᵢ = Σᶫ ẽᶩᵢ  (straight-through)</text>

  <path d="M906.5 459 V507 H838" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <rect x="710" y="485" width="120" height="66" rx="9" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="770" y="512" text-anchor="middle" class="label">Decoder</text>
  <text x="770" y="536" text-anchor="middle" class="formula">D<tspan baseline-shift="sub" font-size="10">ψ</tspan></text>
  <path d="M710 518 H681" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <circle cx="653" cy="518" r="25" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="653" y="524" text-anchor="middle" class="formula">x̂ᵢ</text>

  <rect x="425" y="576" width="700" height="43" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="447" y="602" class="phase" fill="#475569">TRAINABLE</text>
  <rect x="542" y="586" width="204" height="24" rx="12" fill="#f5f3ff"/>
  <text x="644" y="603" text-anchor="middle" class="formula">E<tspan baseline-shift="sub" font-size="10">φ</tspan>, D<tspan baseline-shift="sub" font-size="10">ψ</tspan></text>
  <rect x="760" y="586" width="190" height="24" rx="12" fill="#eff6ff"/>
  <text x="855" y="603" text-anchor="middle" class="formula">C¹, C², …, Cᴸ</text>
  <text x="1104" y="603" text-anchor="end" class="tiny">f<tspan baseline-shift="sub" font-size="9">emb</tspan> frozen</text>

  <!-- (c) Joint objective and backward update -->
  <rect x="1192" y="42" width="67" height="22" rx="11" fill="#fee2e2"/>
  <text x="1225.5" y="57" text-anchor="middle" class="phase" fill="#b91c1c">OPTIMIZE</text>
  <text x="1192" y="91" class="panel-title">(c) 联合目标与反向更新</text>

  <rect x="1195" y="120" width="440" height="91" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="1211" y="136" width="78" height="59" rx="7" fill="#f8fafc"/>
  <text x="1250" y="162" text-anchor="middle" class="formula">L<tspan baseline-shift="sub" font-size="10">rec</tspan></text>
  <text x="1250" y="184" text-anchor="middle" class="tiny">X<tspan baseline-shift="sub" font-size="9">B</tspan>, X̂<tspan baseline-shift="sub" font-size="9">B</tspan></text>
  <text x="1310" y="160" class="formula">= (1/B) Σᵢ ‖x̂ᵢ − xᵢ‖²</text>
  <text x="1310" y="185" class="small">保留 Skill 的语义信息</text>

  <text x="1415" y="229" text-anchor="middle" class="formula">+</text>
  <rect x="1195" y="240" width="440" height="101" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="1211" y="256" width="78" height="68" rx="7" fill="#eff6ff"/>
  <text x="1250" y="283" text-anchor="middle" class="formula">L<tspan baseline-shift="sub" font-size="10">vq</tspan></text>
  <text x="1250" y="306" text-anchor="middle" class="tiny">rᶩᵢ, eᶩᵢ</text>
  <text x="1310" y="273" class="formula">= Avgᵢ,ᶩ [ ‖eᶩᵢ − sg(rᶩ⁻¹ᵢ)‖²</text>
  <text x="1310" y="298" class="formula">　+ β ‖sg(eᶩᵢ) − rᶩ⁻¹ᵢ‖² ]</text>
  <text x="1310" y="323" class="small">更新码本并约束 Encoder 输出</text>

  <text x="1415" y="359" text-anchor="middle" class="formula">+</text>
  <rect x="1195" y="370" width="440" height="101" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <rect x="1211" y="386" width="78" height="68" rx="7" fill="#f0fdf4"/>
  <text x="1250" y="413" text-anchor="middle" class="formula">L<tspan baseline-shift="sub" font-size="10">graph</tspan></text>
  <text x="1250" y="436" text-anchor="middle" class="tiny">E<tspan baseline-shift="sub" font-size="9">B</tspan>, wᵢⱼ</text>
  <text x="1310" y="405" class="formula">= Avgᶩ,(i,j)∈Eᴮ wᵢⱼ ‖eᶩᵢ − eᶩⱼ‖²</text>
  <text x="1310" y="432" class="small">共用 Skill 的量化向量保持接近</text>
  <text x="1310" y="453" class="tiny">仅使用当前 batch 的 induced edges</text>

  <rect x="1195" y="491" width="440" height="62" rx="9" fill="#ffffff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="1415" y="529" text-anchor="middle" class="formula">
    L<tspan baseline-shift="sub" font-size="10">code</tspan>
    = L<tspan baseline-shift="sub" font-size="10">rec</tspan>
    + λ<tspan baseline-shift="sub" font-size="10">q</tspan>(
    L<tspan baseline-shift="sub" font-size="10">vq</tspan>
    + λ<tspan baseline-shift="sub" font-size="10">g</tspan>L<tspan baseline-shift="sub" font-size="10">graph</tspan>)
  </text>
  <path d="M1415 553 V570" fill="none" stroke="#dc2626" stroke-width="1.7" marker-end="url(#arrow-red)"/>

  <rect x="1217" y="578" width="396" height="41" rx="20.5" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1415" y="604" text-anchor="middle" class="small">backprop → update E<tspan baseline-shift="sub" font-size="10">φ</tspan>, D<tspan baseline-shift="sub" font-size="10">ψ</tspan>, C<tspan baseline-shift="super" font-size="10">(1:L)</tspan></text>
  <path d="M1217 598 H1158 V598 H1133" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
</svg>
