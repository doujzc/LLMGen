<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1680" height="590" viewBox="0 0 1680 590" role="img" aria-labelledby="title desc">
  <title id="title">学习式平衡层级 Skill code 构建</title>
  <desc id="desc">从冻结语义表征和 Skill 协同图出发，学习图正则化残差码本，再执行全局容量平衡硬分配，并以 raw 和 assigned 两组指标进行质量检查。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .phase { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .label { font-size: 15px; font-weight: 650; }
      .small { font-size: 13px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 11.5px; font-weight: 500; fill: #64748b; }
      .math { font-family: "Times New Roman", serif; font-size: 17px; font-style: italic; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1680" height="590" fill="#ffffff"/>
  <rect x="20" y="20" width="360" height="550" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="400" y="20" width="530" height="550" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="950" y="20" width="410" height="550" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="1380" y="20" width="280" height="550" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.4"/>

  <path d="M380 295 H392" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M930 295 H942" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1360 295 H1372" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- (a) Representations -->
  <rect x="42" y="42" width="58" height="22" rx="11" fill="#e0f2fe"/>
  <text x="71" y="57" text-anchor="middle" class="phase" fill="#0369a1">INPUT</text>
  <text x="42" y="91" class="panel-title">(a) Skill 表征与协同图</text>

  <rect x="45" y="125" width="112" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M65 147 H137 M65 163 H126 M65 179 H133" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text x="101" y="201" text-anchor="middle" class="small">Skill 文档</text>
  <path d="M157 169 H187" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="195" y="125" width="118" height="88" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <path d="M225 150 L232 143 L239 150 L246 143 L253 150 L260 143 L267 150 L274 143 L281 150" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="254" y="178" text-anchor="middle" class="label">Frozen</text>
  <text x="254" y="199" text-anchor="middle" class="small">text encoder</text>
  <path d="M313 169 H330" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <circle cx="348" cy="148" r="5" fill="#2563eb"/>
