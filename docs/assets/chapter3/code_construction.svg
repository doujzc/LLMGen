  <path d="M566 376 H612 M566 399 H612" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="533" y="424" text-anchor="middle" class="tiny">batch-balanced soft mass</text>

  <rect x="662" y="330" width="243" height="104" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="783.5" y="355" text-anchor="middle" class="label">Graph regularization</text>
  <line x1="704" y1="389" x2="748" y2="375" stroke="#059669" stroke-width="4"/>
  <line x1="748" y1="375" x2="811" y2="396" stroke="#059669" stroke-width="2"/>
  <line x1="811" y1="396" x2="855" y2="377" stroke="#059669" stroke-width="3"/>
  <circle cx="704" cy="389" r="9" fill="#dcfce7" stroke="#059669"/>
  <circle cx="748" cy="375" r="9" fill="#dcfce7" stroke="#059669"/>
  <circle cx="811" cy="396" r="9" fill="#dcfce7" stroke="#059669"/>
  <circle cx="855" cy="377" r="9" fill="#dcfce7" stroke="#059669"/>
  <text x="783.5" y="424" text-anchor="middle" class="tiny">co-used Skills stay close</text>

  <path d="M533 330 V292 H578 V257" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <path d="M783 330 V292 H813 V257" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <rect x="444" y="470" width="135" height="50" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="511.5" y="501" text-anchor="middle" class="small">reconstruction</text>
  <rect x="598" y="470" width="135" height="50" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="665.5" y="501" text-anchor="middle" class="small">VQ + commitment</text>
  <rect x="752" y="470" width="135" height="50" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="819.5" y="501" text-anchor="middle" class="small">graph smoothness</text>

  <!-- (c) Global hard assignment -->
  <rect x="972" y="42" width="67" height="22" rx="11" fill="#fef3c7"/>
  <text x="1005.5" y="57" text-anchor="middle" class="phase" fill="#92400e">ASSIGN</text>
  <text x="972" y="91" class="panel-title">(c) 全局层级平衡分配</text>

  <rect x="980" y="124" width="350" height="74" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.3"/>
  <rect x="997" y="143" width="64" height="35" rx="17.5" fill="#ede9fe"/>
  <text x="1029" y="165" text-anchor="middle" class="phase" fill="#6d28d9">FROZEN</text>
  <text x="1190" y="155" text-anchor="middle" class="label">Encoder + residual codebooks</text>
  <text x="1190" y="178" text-anchor="middle" class="small">all candidate Skills</text>
  <path d="M1155 198 V226" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="1000" y="236" width="310" height="92" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="1155" y="264" text-anchor="middle" class="label">Capacity-balanced matching</text>
