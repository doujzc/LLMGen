  <path d="M1155 424 V439 M1155 433 H1068 V448 M1155 433 H1242 V448" fill="none" stroke="#475569" stroke-width="1.8"/>
  <rect x="1025" y="449" width="86" height="27" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1068" y="467" text-anchor="middle" class="mono">L1:12</text>
  <rect x="1199" y="449" width="86" height="27" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1242" y="467" text-anchor="middle" class="mono">L1:44</text>
  <path d="M1068 476 V491 M1242 476 V491" fill="none" stroke="#0891b2" stroke-width="1.7"/>
  <circle cx="1046" cy="501" r="8" fill="#cffafe" stroke="#0891b2"/>
  <circle cx="1090" cy="501" r="8" fill="#cffafe" stroke="#0891b2"/>
  <circle cx="1220" cy="501" r="8" fill="#cffafe" stroke="#0891b2"/>
  <circle cx="1264" cy="501" r="8" fill="#cffafe" stroke="#0891b2"/>

  <!-- (d) Quality gate -->
