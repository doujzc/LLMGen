  <rect x="57" y="442" width="286" height="75" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="471" text-anchor="middle" class="label">离线输入</text>
  <text x="200" y="496" text-anchor="middle" class="small">normalized embeddings + co-use graph</text>

  <!-- (b) Codebook learning -->
  <rect x="422" y="42" width="58" height="22" rx="11" fill="#ede9fe"/>
  <text x="451" y="57" text-anchor="middle" class="phase" fill="#6d28d9">LEARN</text>
  <text x="422" y="91" class="panel-title">(b) 图正则化残差量化</text>

  <rect x="425" y="124" width="480" height="179" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="457" cy="201" r="22" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="457" y="207" text-anchor="middle" class="math">zᵢ</text>
