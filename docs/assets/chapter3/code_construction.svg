  <rect x="45" y="268" width="130" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="293" text-anchor="middle" class="label">Query targets</text>
  <rect x="59" y="310" width="102" height="27" rx="5" fill="#f1f5f9"/>
  <circle cx="78" cy="323.5" r="6" fill="#2563eb"/>
  <circle cx="96" cy="323.5" r="6" fill="#059669"/>
  <rect x="59" y="345" width="102" height="27" rx="5" fill="#f1f5f9"/>
  <circle cx="78" cy="358.5" r="6" fill="#2563eb"/>
  <circle cx="96" cy="358.5" r="6" fill="#f59e0b"/>
  <text x="145" y="363" text-anchor="middle" class="small">…</text>
  <text x="110" y="387" text-anchor="middle" class="tiny">按原始 query 去重</text>
  <path d="M175 332 H205" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="213" y="268" width="142" height="128" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <line x1="251" y1="313" x2="310" y2="300" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  <line x1="251" y1="313" x2="278" y2="359" stroke="#059669" stroke-width="2.2"/>
  <line x1="310" y1="300" x2="326" y2="352" stroke="#059669" stroke-width="3.4"/>
  <line x1="278" y1="359" x2="326" y2="352" stroke="#059669" stroke-width="1.4"/>
  <circle cx="251" cy="313" r="10" fill="#dbeafe" stroke="#2563eb"/>
