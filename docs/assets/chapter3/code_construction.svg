  <circle cx="695" cy="201" r="21" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="695" y="207" text-anchor="middle" class="math">r¹</text>
  <path d="M716 201 H741" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="749" y="153" width="128" height="96" rx="8" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="813" y="176" text-anchor="middle" class="label">Level 2</text>
  <circle cx="778" cy="207" r="8" fill="#cffafe" stroke="#0891b2"/>
  <circle cx="803" cy="207" r="10" fill="#0891b2"/>
  <circle cx="828" cy="207" r="8" fill="#cffafe" stroke="#0891b2"/>
  <circle cx="853" cy="207" r="8" fill="#cffafe" stroke="#0891b2"/>
