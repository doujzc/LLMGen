<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1680" height="570" viewBox="0 0 1680 570" role="img" aria-labelledby="title desc">
  <title id="title">LLMGen 整体算法框架</title>
  <desc id="desc">图分为三个子图：层级 Skill code 构建、语言模型词表扩充，以及受合法路径约束的在线生成式 Skill 路由。</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/>
    </marker>
    <style>
      text {
        font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        fill: #111827;
      }
      .panel-title { font-size: 22px; font-weight: 700; }
      .phase { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 14px; font-weight: 500; fill: #475569; }
      .token { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13.5px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1680" height="570" fill="#ffffff"/>

