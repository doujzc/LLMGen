[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmgen"
version = "0.1.0"
description = "Short hierarchical tokenization for dynamic Agent Skill routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT for original LLMGen code; excludes vendored ToolWeaver modules (see llmgen/vendor/toolweaver/README.md)" }
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2,<2",
  "deepspeed==0.19.1",
  "huggingface-hub>=0.27,<2",
  "openai>=1.58,<3",
  "peft>=0.19.1,<1",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "sentence-transformers>=5.4.1,<6",
  "torch==2.6.0",
  "tqdm>=4.66,<5",
  "transformers>=5.5.4,<6",
]
test = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llmgen.vendor.toolweaver" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
