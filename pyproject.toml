[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmgen"
version = "0.1.0"
description = "Short hierarchical tokenization for dynamic Agent Skill routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT for original LLMGen code; excludes vendored ToolWeaver modules (see llmgen/vendor/toolweaver/README.md)" }
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2,<2",
  # DeepSpeed 0.17.6 and 0.19.1 regress ZeRO-3 with PEFT modules_to_save (the
  # resized code-token embeddings/lm_head); 0.16.4 retains the safe hook path.
  "deepspeed==0.16.4",
  "huggingface-hub>=0.27,<2",
  "openai>=1.58,<3",
  "peft>=0.19.1,<1",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "sentence-transformers>=5.4.1,<6",
  "torch==2.6.0",
  "tqdm>=4.66,<5",
  "transformers>=5.5.4,<6",
]
test = [
  # pytest 9's logging capture leaves handlers attached to service-local
  # non-propagating loggers, breaking the stdout-only deployment invariant.
  "pytest>=7.4,<9",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["llmgen*", "training_console*"]
exclude = ["tests*", "web_server*"]

[tool.setuptools.package-data]
"llmgen.vendor.toolweaver" = ["README.md"]
"training_console" = ["README.md", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
