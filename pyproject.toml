[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmgen"
version = "0.1.0"
description = "Direct candidate-name Top1 router training"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate>=1.2,<2",
  "deepspeed==0.16.4",
  "peft>=0.19.1,<1",
  "torch==2.6.0",
  "tqdm>=4.66,<5",
  "transformers==5.14.1",
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["llmgen*"]
